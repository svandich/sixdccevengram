<!doctype html>
<html lang="es" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six DCCevenGram</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside id="left">
    <div class="left-head">
      <button id="close-left" class="icon-btn narrow-only" title="Volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="left-title">Six DCCevenGram</div>
    </div>
    <div id="dialog-list" class="list"></div>
    <div class="left-foot">Las respuestas se guardan de forma anónima (solo hora y respuestas).</div>
  </aside>

  <main id="chat">
    <header class="topbar">
      <button id="open-left" class="icon-btn narrow-only" title="Chats"><svg viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div id="tb-pic" class="tb-pic"></div>
      <div class="tb-title"><div class="tb-name" id="tb-name">Quiz Selector</div><div class="tb-sub" id="tb-sub">bot</div></div>
      <button id="theme-btn" class="icon-btn" title="Cambiar tema"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    </header>
    <div id="pinned">
      <div class="pin-bars"></div>
      <div class="pin-body"><div class="pin-title">Mensaje fijado</div><div class="pin-text" id="pin-text">Esto es una guía: no reemplaza leer los programas.</div></div>
      <svg class="pin-icon" viewBox="0 0 24 24"><path d="M14.5 3.5l6 6-2.2.9-3.4 3.4.4 4.2-1.5 1.5-3.6-3.6-4.7 4.7-1-1 4.7-4.7-3.6-3.6 1.5-1.5 4.2.4 3.4-3.4z"/></svg>
    </div>
    <div class="history-wrap">
      <div class="wallpaper"><div class="wp-pattern"></div></div>
      <div id="history" class="history"><div id="history-inner" class="history-inner"></div></div>
      <div id="history-links" class="history" hidden><div id="links-inner" class="history-inner"></div></div>
      <div id="history-about" class="history" hidden><div id="about-inner" class="history-inner"></div></div>
    </div>
    <footer class="composebar">
      <span data-footer="links" hidden>Solo lectura · los programas y las cuentas de cada lista</span>
      <span data-footer="about" hidden>Escríbeme por Telegram: <a href="https://t.me/dmitroia" target="_blank" rel="noopener">@dmitroia</a></span>
      <div data-footer="quiz" class="footer-pane">
      <span id="composebar">Elige una opción en los botones</span>
      <form id="composer" class="composer" hidden>
        <textarea id="compose-input" rows="1" maxlength="1000" placeholder="Escribe un comentario…"></textarea>
        <button id="compose-send" class="icon-btn send-btn" type="submit" title="Enviar"><svg viewBox="0 0 24 24"><path d="M3.4 20.4l17.4-7.5c.8-.4.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.2-1.4.9L2 9.1c0 .5.4.9.9 1l13.6 1.9-13.6 1.9c-.5.1-.9.5-.9 1l.1 4.6c0 .7.7 1.2 1.3.9z"/></svg></button>
      </form>
      </div>
    </footer>
  </main>
</div>
<script src="vendor/altcha.min.js"></script>
<script src="vendor/altcha-es-419.js"></script>
<script src="app.js"></script>
</body>
</html>
